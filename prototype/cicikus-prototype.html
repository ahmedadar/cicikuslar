<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cicikuş Kart Oyunu - Prototip</title>
<style>
:root{--bg:#14181f;--panel:#1d2430;--panel2:#252e3d;--txt:#e8edf5;--mut:#8a97ab;--hp:#e5484d;--en:#f5b53d;--sh:#4aa3ff;--ok:#3ecf8e;--atk:#e5484d;--def:#4aa3ff;--sp:#a78bfa;--line:#33405a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:8px 10px;gap:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.name{font-weight:700}.mut{color:var(--mut)}.sp{flex:1}
.stat{display:inline-flex;gap:4px;align-items:center;background:var(--panel2);border-radius:8px;padding:2px 8px;font-weight:600}
.hp{color:var(--hp)}.en{color:var(--en)}.sh{color:var(--sh)}
.slots{display:flex;gap:3px}.slot{width:16px;height:16px;border-radius:4px;border:2px solid;display:inline-block}
.slot.s{border-color:var(--sh)}.slot.e{border-color:var(--en)}.slot.lock{opacity:.35;background:repeating-linear-gradient(45deg,#000 0 3px,transparent 3px 6px)}
.tag{font-size:11px;background:#2d3a52;border-radius:6px;padding:1px 6px;color:#cdd8ea}
#mid{display:flex;gap:8px}
#mid .panel{flex:1;min-width:0}
#log{height:92px;overflow-y:auto;font-size:12px;color:#c3cde0}
#log div{padding:1px 0}#log .me{color:#9fd4ff}#log .op{color:#ffb0b3}#log .sys{color:var(--en)}
#hand{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px;scroll-snap-type:x proximity;min-height:132px}
.card{flex:0 0 96px;scroll-snap-align:start;background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;position:relative;color:var(--txt);text-align:left;font:inherit}
.card .c{position:absolute;top:-8px;right:-6px;background:var(--en);color:#111;border-radius:12px;font-weight:800;font-size:12px;padding:1px 7px}
.card .c.hpc{background:var(--hp);color:#fff}
.card b{font-size:12.5px;padding-right:18px}.card small{font-size:11px;color:#cdd8ea}
.card.attack{border-color:var(--atk)}.card.shield{border-color:var(--def)}.card.hybrid{border-color:#c07be0}.card.draw,.card.energy{border-color:var(--ok)}
.card.slot,.card.stun,.card.reaction,.card.recycle,.card.buff,.card.permanent{border-color:var(--sp)}.card.curse{border-color:#777;background:#2a1d2e}
.card.off{opacity:.42}.card.sel{outline:3px solid var(--en);transform:translateY(-4px)}
.back{flex:0 0 40px;height:56px;background:repeating-linear-gradient(45deg,#2a3550 0 6px,#222c43 6px 12px);border:2px solid var(--line);border-radius:8px;cursor:default}
.back.pick{cursor:pointer;border-color:var(--en)}
#acts{display:flex;gap:6px;flex-wrap:wrap}
button.b{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;font-weight:600;flex:1;min-width:0;cursor:pointer}
button.b:disabled{opacity:.4}button.b.pri{background:var(--ok);color:#06210f;border-color:var(--ok)}
#prompt{background:#3a2f14;border:1px solid var(--en);border-radius:10px;padding:7px 10px;display:none}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;max-width:420px;width:100%;max-height:90vh;overflow:auto}
#modal h3{margin:0 0 8px}#modal .opt{display:block;width:100%;margin:6px 0;text-align:left}
.turn{display:inline-block;padding:1px 8px;border-radius:8px;font-weight:700;background:var(--en);color:#111}
.turn.opp{background:var(--hp);color:#fff}
</style>
</head>
<body>
<div id="app">
  <div class="panel" id="oppPanel"></div>
  <div id="mid">
    <div class="panel" id="info"></div>
    <div class="panel" style="flex:1.6"><div id="log"></div></div>
  </div>
  <div id="prompt"></div>
  <div class="panel" id="mePanel"></div>
  <div id="hand"></div>
  <div id="acts"></div>
</div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<script>
// otomatik uretildi: python3 tools/build_prototype.py (kaynak: data/cards.json)
var CICIKUS_CARDS = [{"id": "atk1", "name_tr": "Pençe", "name_en": "Claw", "group": "oyun", "type": "attack", "cost": 1, "cost_type": "energy", "count": 8, "effect": {"atk": 1}, "text_tr": "1 Hasar ver."}, {"id": "sh1", "name_tr": "Kanat Siperi", "name_en": "Wing Guard", "group": "oyun", "type": "shield", "cost": 1, "cost_type": "energy", "count": 8, "effect": {"shield": 1}, "text_tr": "1 Kalkan kazan."}, {"id": "atk1sh1", "name_tr": "Atılış", "name_en": "Swoop", "group": "oyun", "type": "hybrid", "cost": 2, "cost_type": "energy", "count": 4, "effect": {"atk": 1, "shield": 1}, "text_tr": "1 Hasar ver. 1 Kalkan kazan."}, {"id": "sh2", "name_tr": "Tüy Duvarı", "name_en": "Feather Wall", "group": "oyun", "type": "shield", "cost": 2, "cost_type": "energy", "count": 4, "effect": {"shield": 2}, "text_tr": "2 Kalkan kazan."}, {"id": "atk2", "name_tr": "Gaga Darbesi", "name_en": "Beak Strike", "group": "oyun", "type": "attack", "cost": 2, "cost_type": "energy", "count": 4, "effect": {"atk": 2}, "text_tr": "2 Hasar ver."}, {"id": "draw2", "name_tr": "Keşif Uçuşu", "name_en": "Scout Flight", "group": "oyun", "type": "draw", "cost": 1, "cost_type": "energy", "count": 4, "effect": {"draw": 2}, "text_tr": "2 kart çek."}, {"id": "gain1", "name_tr": "Tüneme", "name_en": "Perch", "group": "oyun", "type": "energy", "cost": 0, "cost_type": "energy", "count": 4, "effect": {"gain_energy": 1}, "text_tr": "1 Enerji kazan."}, {"id": "shslot_add", "name_tr": "Siper Kur", "name_en": "Build Bulwark", "group": "durum", "type": "slot", "cost": 2, "cost_type": "energy", "count": 2, "effect": {"special": "shield_slot_add"}, "text_tr": "Kalkan Yuvası +1 (en fazla 4). Kalıcı."}, {"id": "shslot_break", "name_tr": "Siper Kır", "name_en": "Breach", "group": "durum", "type": "slot", "cost": 2, "cost_type": "energy", "count": 2, "effect": {"special": "shield_slot_break"}, "text_tr": "Rakibin 1 Kalkan Yuvası'nı yok et (en az 1 kalır). Yuva dışında kalan Kalkan kaybolur."}, {"id": "enslot_add", "name_tr": "Kan Bedeli", "name_en": "Blood Price", "group": "durum", "type": "slot", "cost": 2, "cost_type": "hp", "count": 2, "effect": {"special": "energy_slot_add"}, "text_tr": "2 Can öde. Enerji Yuvası +1 (en fazla 4). Kalıcı."}, {"id": "status_draw", "name_tr": "Durum Avı", "name_en": "Status Hunt", "group": "durum", "type": "draw", "cost": 1, "cost_type": "energy", "count": 2, "effect": {"special": "status_draw"}, "text_tr": "Destenin üstünden ilk Durum kartı çıkana kadar kart aç. Onu eline al, açılan diğerlerini destenin altına karışık koy."}, {"id": "reflect", "name_tr": "Ayna Tüy", "name_en": "Mirror Plume", "group": "durum", "type": "reaction", "cost": 1, "cost_type": "energy", "count": 2, "effect": {"special": "reflect"}, "text_tr": "Bir sonraki turuna kadar: seni hedefleyen ilk Saldırı'nın Hasar'ı kadar (en fazla 3) rakibe engellenemez Hasar yansıt."}, {"id": "lock_shield", "name_tr": "Kilit: Siper", "name_en": "Lock: Bulwark", "group": "durum", "type": "stun", "cost": 1, "cost_type": "energy", "count": 1, "effect": {"special": "lock_shield"}, "text_tr": "Rakibin 1 Kalkan Yuvası bu tur Kilitli: etkin Kalkan kapasitesi 2 azalır."}, {"id": "lock_energy", "name_tr": "Kilit: Kaynak", "name_en": "Lock: Source", "group": "durum", "type": "stun", "cost": 1, "cost_type": "energy", "count": 1, "effect": {"special": "lock_energy"}, "text_tr": "Rakibin 1 Enerji Yuvası sonraki turunda Kilitli: o tur 1 az Enerji kazanır."}, {"id": "curse", "name_tr": "Kara Tüy", "name_en": "Black Feather", "group": "ozel", "type": "curse", "cost": null, "cost_type": null, "count": 1, "effect": {"special": "curse"}, "text_tr": "Oynanamaz. Elindeyken Tur Sonu'nda 1 Hasar al. 2 kartlık Çöp Atma veya Takas ile elden çıkarılır."}, {"id": "recycle_free", "name_tr": "Hortlayan Hamle", "name_en": "Second Wind", "group": "ozel", "type": "recycle", "cost": 1, "cost_type": "energy", "count": 1, "effect": {"special": "recycle"}, "text_tr": "Çöpün en üstündeki kartı (Lanet hariç) bedava oyna."}, {"id": "multiplier", "name_tr": "Cicikuş Çığlığı", "name_en": "Screech", "group": "ozel", "type": "buff", "cost": 1, "cost_type": "energy", "count": 1, "effect": {"special": "multiplier"}, "text_tr": "Bu turda oynayacağın bir sonraki Saldırı/Kalkan/Çekme/Enerji kartının sayıları ×2."}, {"id": "metallic", "name_tr": "Metalik Deri", "name_en": "Metal Skin", "group": "ozel", "type": "permanent", "cost": 3, "cost_type": "energy", "count": 1, "effect": {"special": "metallic"}, "text_tr": "Kalıcı. Her tur başı 1 Kalkan kazan."}];
if (typeof module !== 'undefined') module.exports = CICIKUS_CARDS;

</script>
<script>
// Cicikus Kart Oyunu - kural cekirdegi (senaryo C). UI'dan bagimsiz; Unity/Godot'a port edilebilir.
// Senaryo C: ortak 104 kart (2x52), ortak Cop, Can 20, Enerji 4 (2. oyuncu 5), Gerilim 7. turdan.
(function (root) {
  var CARDS = (typeof module !== 'undefined' && typeof require === 'function') ? require('./cards-data.js') : root.CICIKUS_CARDS;
  var INFO = {}; CARDS.forEach(function (c) { INFO[c.id] = c; });

  var RULES = { hp: 20, energy: 4, secondEnergy: 5, hand: 5, draw: 2, handLimit: 7, bankCap: 8,
    perSlot: 2, shSlots: 2, enSlots: 2, maxSh: 4, maxEn: 4, gerilimFrom: 7, copies: 2,
    reflectCap: 3, scrapMax: 2, stackMetal: false };

  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function shuffle(a, rng) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rng() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  function newPlayer(R, second) {
    return { hp: R.hp, en: second ? R.secondEnergy : R.energy, hand: [], shield: 0, shSlots: R.shSlots, enSlots: R.enSlots,
      shLock: 0, enLock: 0, metal: false, reflect: 0, mult: 1, stash: null, stashTurn: -1, scraps: 0, tactic: false,
      played: 0, dealt: 0 };
  }

  function newGame(seed, rules) {
    var R = Object.assign({}, RULES, rules || {}); var rng = mulberry32(seed == null ? (Math.random() * 1e9) | 0 : seed);
    var deck = [];
    CARDS.forEach(function (c) { for (var i = 0; i < c.count * R.copies; i++) deck.push(c.id); });
    shuffle(deck, rng);
    var G = { R: R, rng: rng, deck: deck, disc: [], p: [newPlayer(R, false), newPlayer(R, true)], turn: 0, round: 1, tcount: 0,
      phase: 'risk', winner: null, why: '', log: [], gerilimHit: false };
    draw(G, 0, R.hand); draw(G, 1, R.hand);
    beginTurn(G);
    return G;
  }

  function log(G, who, msg) { G.log.push({ who: who, msg: msg }); }
  function draw(G, who, n) {
    var got = 0;
    for (var i = 0; i < n; i++) {
      if (!G.deck.length) { G.deck = shuffle(G.disc, G.rng); G.disc = []; }
      if (!G.deck.length) break;
      G.p[who].hand.push(G.deck.pop()); got++;
    }
    return got;
  }
  function cap(p) { return RULES.perSlot * Math.max(0, p.shSlots - p.shLock); }
  function effShield(p) { return Math.min(p.shield, cap(p)); }

  function checkEnd(G) {
    if (G.winner !== null) return true;
    var a = G.p[0].hp, b = G.p[1].hp;
    if (a > 0 && b > 0) return false;
    if (a <= 0 && b <= 0) { G.winner = a > b ? 0 : 1; G.why = 'Ayni anda 0: Can fazla / esitlikte 2. oyuncu'; }
    else G.winner = a <= 0 ? 1 : 0;
    G.phase = 'ended'; if (!G.why) G.why = 'Can 0'; log(G, G.winner, 'Oyun bitti.');
    return true;
  }

  function hit(G, me, dmg) {
    var A = G.p[me], D = G.p[1 - me];
    var eff = effShield(D), ab = Math.min(eff, dmg); D.shield -= ab; var thru = dmg - ab;
    D.hp -= thru; A.dealt += thru;
    if (thru || ab) log(G, me, 'Hasar ' + dmg + (ab ? ' (Kalkan ' + ab + ' emdi)' : '') + (thru ? ' -> Can -' + thru : ''));
    if (checkEnd(G)) return;
    if (D.reflect) { var r = Math.min(dmg, G.R.reflectCap); A.hp -= r; D.reflect = 0; log(G, 1 - me, 'Yansit: rakibe ' + r + ' Hasar'); checkEnd(G); }
  }

  // ---- tur akisi ----
  function beginTurn(G) {
    var who = G.turn, P = G.p[who];
    if (who === 0 && G.round >= G.R.gerilimFrom) {
      var f = G.round - G.R.gerilimFrom + 1; G.p[0].hp -= f; G.p[1].hp -= f; G.gerilimHit = true;
      log(G, -1, 'GERILIM: iki oyuncu da ' + f + ' Can kaybeder.');
      if (checkEnd(G)) return;
    }
    P.shield = 0; P.reflect = 0; P.mult = 1; P.scraps = 0; P.tactic = false; P.riskUsed = false;
    G.phase = 'risk';
  }

  // mode: 'none' | 'cesur' | 'kumar'  (kumar: opts.heads boolean opsiyonel)
  function chooseRisk(G, who, mode, heads) {
    if (G.phase !== 'risk' || G.turn !== who) return { ok: false, err: 'Risk fazi degil' };
    var P = G.p[who], R = G.R, gain = Math.max(0, P.enSlots - P.enLock); P.enLock = 0; var extra = 0;
    if (mode === 'cesur') { gain = Math.max(0, gain - 1); extra = 2; log(G, who, 'Cesur: +2 kart, -1 Enerji'); }
    var kumarTails = false;
    if (mode === 'kumar') {
      if (heads === undefined) heads = G.rng() < 0.5;
      if (heads) { extra = 1; gain += 1; log(G, who, 'Kumar: YAZI -> +1 kart, +1 Enerji'); }
      else { kumarTails = true; log(G, who, 'Kumar: TURA -> -1 Enerji, -1 Can'); }
    }
    P.en = Math.min(R.bankCap, P.en + gain);
    if (kumarTails) { P.en = Math.max(0, P.en - 1); P.hp -= 1; if (checkEnd(G)) return { ok: true }; }
    if (P.metal) { P.shield = Math.min(1, cap(P)); }
    draw(G, who, R.draw + extra);
    G.phase = 'main'; log(G, who, 'Tur basi: Enerji ' + P.en + ', el ' + P.hand.length);
    return { ok: true, heads: heads };
  }

  function canPlay(G, who, id, free) {
    var c = INFO[id], P = G.p[who], k = c.effect.special;
    if (G.phase !== 'main' || G.turn !== who) return 'Senin turun degil';
    if (k === 'curse') return 'Lanet oynanamaz';
    if (k === 'recycle') { var t = G.disc[G.disc.length - 1]; if (!t || INFO[t].effect.special === 'curse' || INFO[t].effect.special === 'recycle') return 'Cop ustu uygun degil'; }
    if (k === 'metallic' && P.metal && !G.R.stackMetal) return 'Zaten masada';
    if (!free) {
      if (c.cost_type === 'hp') { if (P.hp <= c.cost) return 'Yeterli Can yok'; }
      else if (P.en < c.cost) return 'Yeterli Enerji yok';
    }
    return null;
  }

  function apply(G, who, id, free) {
    var c = INFO[id], P = G.p[who], O = G.p[1 - who], e = c.effect, k = e.special;
    if (!free) { if (c.cost_type === 'hp') P.hp -= c.cost; else P.en -= c.cost; }
    var numeric = e.atk || e.shield || e.draw || e.gain_energy; var m = P.mult; if (numeric) P.mult = 1;
    log(G, who, c.name_tr + (m > 1 && numeric ? ' (x2)' : ''));
    if (e.atk) hit(G, who, e.atk * m);
    if (G.winner !== null) return;
    if (e.shield) { P.shield = Math.min(P.shield + e.shield * m, cap(P)); }
    if (e.draw) draw(G, who, e.draw * m);
    if (e.gain_energy) P.en = Math.min(G.R.bankCap, P.en + e.gain_energy * m);
    switch (k) {
      case 'shield_slot_add': P.shSlots = Math.min(G.R.maxSh, P.shSlots + 1); break;
      case 'shield_slot_break': O.shSlots = Math.max(1, O.shSlots - 1); O.shield = Math.min(O.shield, cap(O)); break;
      case 'energy_slot_add': P.enSlots = Math.min(G.R.maxEn, P.enSlots + 1); break;
      case 'status_draw':
        var seen = [], found = null;
        while (G.deck.length || G.disc.length) {
          if (!G.deck.length) { G.deck = shuffle(G.disc, G.rng); G.disc = []; }
          var x = G.deck.pop();
          if (INFO[x].group === 'durum' && x !== 'status_draw') { found = x; break; }
          seen.push(x);
        }
        if (found) { P.hand.push(found); log(G, who, 'Durum Avi: ' + INFO[found].name_tr); }
        shuffle(seen, G.rng); G.deck = seen.concat(G.deck); break;
      case 'reflect': P.reflect = 1; break;
      case 'lock_shield': O.shLock = 1; break;
      case 'lock_energy': O.enLock = 1; break;
      case 'multiplier': P.mult = 2; break;
      case 'metallic': P.metal = true; break;
    }
    P.played++;
    checkEnd(G);
  }

  // src: el indeksi (sayi) veya 'stash'
  function playCard(G, who, src) {
    var P = G.p[who], id, free = false;
    if (src === 'stash') {
      if (!P.stash || G.tcount <= P.stashTurn) return { ok: false, err: 'Gizli kart henuz hazir degil' };
      id = P.stash; free = true;
    } else { id = P.hand[src]; if (!id) return { ok: false, err: 'Kart yok' }; }
    var err = canPlay(G, who, id, free); if (err) return { ok: false, err: err };
    var k = INFO[id].effect.special;
    if (src === 'stash') P.stash = null; else P.hand.splice(src, 1);
    if (k === 'recycle') {
      if (!free) P.en -= INFO[id].cost; G.disc.push(id); log(G, who, 'Hortlayan Hamle');
      var t = G.disc.splice(G.disc.length - 2, 1)[0];
      apply(G, who, t, true); if (INFO[t].effect.special !== 'metallic') G.disc.push(t);
      return { ok: true };
    }
    apply(G, who, id, free);
    if (!(k === 'metallic')) G.disc.push(id);
    return { ok: true };
  }

  function scrap(G, who, i, j) {
    var P = G.p[who];
    if (G.phase !== 'main' || G.turn !== who) return { ok: false, err: 'Senin turun degil' };
    if (P.scraps >= G.R.scrapMax) return { ok: false, err: 'Tur basina en fazla ' + G.R.scrapMax + ' Cop Atma' };
    if (i === j || P.hand[i] == null || P.hand[j] == null) return { ok: false, err: 'Iki farkli kart sec' };
    var hi = Math.max(i, j), lo = Math.min(i, j);
    G.disc.push(P.hand.splice(hi, 1)[0], P.hand.splice(lo, 1)[0]);
    draw(G, who, 1); P.scraps++; log(G, who, 'Cop Atma (2->1)');
    return { ok: true };
  }

  // ---- taktikler (tur basina 1) ----
  function stash(G, who, i) {
    var P = G.p[who];
    if (G.phase !== 'main' || G.turn !== who) return { ok: false, err: 'Senin turun degil' };
    if (P.tactic) return { ok: false, err: 'Bu tur Taktik kullandin' };
    if (P.stash) return { ok: false, err: 'Gizli Alan dolu' };
    if (!P.hand[i]) return { ok: false, err: 'Kart yok' };
    P.stash = P.hand.splice(i, 1)[0]; P.stashTurn = G.tcount; P.tactic = true; log(G, who, 'Gizle: 1 kart kapali konuldu'); return { ok: true };
  }
  // mode 'swap' (2 E, myIdx gerekli) | 'discard' (3 E)
  function takas(G, who, oppIdx, mode, myIdx) {
    var P = G.p[who], O = G.p[1 - who], cost = mode === 'discard' ? 3 : 2;
    if (G.phase !== 'main' || G.turn !== who) return { ok: false, err: 'Senin turun degil' };
    if (P.tactic) return { ok: false, err: 'Bu tur Taktik kullandin' };
    if (P.en < cost) return { ok: false, err: 'Yeterli Enerji yok' };
    if (!O.hand.length || O.hand[oppIdx] == null) return { ok: false, err: 'Rakibin eli bos' };
    var taken = O.hand[oppIdx];
    if (mode === 'swap') {
      if (P.hand[myIdx] == null) return { ok: false, err: 'Verecegin karti sec' };
      O.hand[oppIdx] = P.hand[myIdx]; P.hand[myIdx] = taken; log(G, who, 'Takas: rakibin elinden kart alindi, 1 kart verildi');
    } else { O.hand.splice(oppIdx, 1); G.disc.push(taken); log(G, who, 'Takas: rakibin karti Cop\'e atildi (' + INFO[taken].name_tr + ')'); }
    P.en -= cost; P.tactic = true; return { ok: true, taken: taken };
  }
  function gozcuPeek(G) { return G.deck.slice(-2).reverse(); } // [ust, ikinci]
  // bottom: [bool ust, bool ikinci] -> true = destenin altina
  function gozcu(G, who, bottom) {
    var P = G.p[who];
    if (G.phase !== 'main' || G.turn !== who) return { ok: false, err: 'Senin turun degil' };
    if (P.tactic) return { ok: false, err: 'Bu tur Taktik kullandin' };
    if (P.en < 1) return { ok: false, err: 'Yeterli Enerji yok' };
    var top = [];
    for (var n = 0; n < 2; n++) { if (!G.deck.length && G.disc.length) { G.deck = shuffle(G.disc, G.rng); G.disc = []; } if (G.deck.length) top.push(G.deck.pop()); }
    var keep = [], down = [];
    top.forEach(function (c, i) { (bottom[i] ? down : keep).push(c); });
    G.deck = down.concat(G.deck); for (var i = keep.length - 1; i >= 0; i--) G.deck.push(keep[i]);
    P.en -= 1; P.tactic = true; log(G, who, 'Gozcu: ust 2 karta bakildi (' + down.length + ' alta)'); return { ok: true };
  }

  function needDiscard(G, who) { return Math.max(0, G.p[who].hand.length - G.R.handLimit); }
  function endTurn(G, who, discardIdx) {
    var P = G.p[who];
    if (G.phase !== 'main' || G.turn !== who) return { ok: false, err: 'Senin turun degil' };
    if (P.hand.indexOf('curse') >= 0) { P.hp -= 1; log(G, who, 'Lanet: -1 Can'); if (checkEnd(G)) return { ok: true }; }
    var n = needDiscard(G, who);
    if (n > 0) {
      var idx = (discardIdx || []).slice().sort(function (a, b) { return b - a; });
      if (idx.length !== n) { return { ok: false, needDiscard: n, err: 'El siniri: ' + n + ' kart at' }; }
      idx.forEach(function (i) { G.disc.push(P.hand.splice(i, 1)[0]); });
    }
    P.mult = 1; G.p[1 - who].shLock = 0;
    G.tcount++; G.turn = 1 - who; if (G.turn === 0) G.round++;
    beginTurn(G); return { ok: true };
  }

  // ---- bot ----
  function score(G, who, id) {
    var me = G.p[who], op = G.p[1 - who], c = INFO[id], e = c.effect, k = e.special, per = c.cost || 0.5;
    if (e.gain_energy) return 100;
    if (k === 'multiplier') return me.hand.some(function (h) { return (INFO[h].effect.atk || 0) >= 2; }) ? 90 : -1;
    if (k === 'energy_slot_add') return me.hp > 8 ? 85 : -1;
    if (k === 'metallic') return me.metal ? -1 : 80;
    if (k === 'status_draw') return 60;
    if (k === 'recycle') { var t = G.disc[G.disc.length - 1]; return t && ['attack', 'shield', 'hybrid', 'draw'].indexOf(INFO[t].type) >= 0 ? 70 : -1; }
    if (k === 'lock_shield') return op.shield > 1 && me.hand.some(function (h) { return h !== id && INFO[h].effect.atk; }) ? 75 : -1;
    if (k === 'lock_energy') return 40;
    if (k === 'shield_slot_break') return op.shSlots > 2 ? 55 : 30;
    if (k === 'shield_slot_add') return 20;
    if (k === 'reflect') return 25;
    if (e.draw && !e.atk) return 50;
    var a = e.atk || 0, s = e.shield || 0, danger = me.hp <= 8 ? 1.6 : (me.hp <= 13 ? 1.0 : 0.6);
    var v = (a * 10 * (a * me.mult >= op.hp ? 2 : 1) + s * 10 * danger * 0.9) / per;
    if (op.hp <= 6) v += a * 4;
    return v;
  }
  // tek bir bot aksiyonu; false = tur bitti
  function botStep(G) {
    var who = G.turn, P = G.p[who];
    if (G.winner !== null) return false;
    if (G.phase === 'risk') { chooseRisk(G, who, 'none'); return true; }
    if (G.phase !== 'main') return false;
    var ci = P.hand.indexOf('curse');
    if (ci >= 0 && P.hand.length >= 2 && P.scraps < G.R.scrapMax) {
      var best = -1, bs = 1e9; P.hand.forEach(function (h, i) { if (i !== ci) { var s = score(G, who, h); if (s < bs) { bs = s; best = i; } } });
      scrap(G, who, ci, best); return true;
    }
    if (ci >= 0 && !P.tactic && P.en >= 2 && G.p[1 - who].hand.length) { // Lanet'i rakibe devret
      var oi = Math.floor(G.rng() * G.p[1 - who].hand.length); takas(G, who, oi, 'swap', ci); return true;
    }
    var opts = [];
    P.hand.forEach(function (h, i) { if (!canPlay(G, who, h)) { var s = score(G, who, h); if (s > 0) opts.push([s, i]); } });
    if (opts.length) { opts.sort(function (a, b) { return b[0] - a[0]; }); playCard(G, who, opts[0][1]); return true; }
    if (P.stash === null && false) return false;
    var n = needDiscard(G, who), di = [];
    if (n > 0) { var order = P.hand.map(function (h, i) { return [score(G, who, h), i]; }).sort(function (a, b) { return a[0] - b[0]; }); di = order.slice(0, n).map(function (o) { return o[1]; }); }
    endTurn(G, who, di); return false;
  }

  var API = { CARDS: CARDS, INFO: INFO, RULES: RULES, newGame: newGame, chooseRisk: chooseRisk, canPlay: canPlay, playCard: playCard,
    scrap: scrap, stash: stash, takas: takas, gozcu: gozcu, gozcuPeek: gozcuPeek, endTurn: endTurn, needDiscard: needDiscard,
    botStep: botStep, cap: cap, effShield: effShield, score: score };
  if (typeof module !== 'undefined') module.exports = API; else root.Cicikus = API;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function () {
  var E = window.Cicikus, INFO = E.INFO;
  var G, H = 0, mode = null, sel = [], busy = false, takasTarget = null;
  var $ = function (id) { return document.getElementById(id); };
  var typeTr = { attack: 'Saldırı', shield: 'Kalkan', hybrid: 'Melez', draw: 'Çekme', energy: 'Enerji', slot: 'Yuva', stun: 'Kilit', reaction: 'Tepki', curse: 'Lanet', recycle: 'Özel', buff: 'Güçlendir', permanent: 'Kalıcı' };

  function costTxt(c) { return c.cost == null ? '—' : (c.cost_type === 'hp' ? c.cost + ' Can' : c.cost + ' E'); }
  function cardHtml(id, cls, extra) {
    var c = INFO[id];
    return '<button class="card ' + c.type + ' ' + (cls || '') + '" ' + (extra || '') + '>' +
      '<span class="c ' + (c.cost_type === 'hp' ? 'hpc' : '') + '">' + costTxt(c) + '</span><b>' + c.name_tr + '</b><small>' + c.text_tr + '</small></button>';
  }
  function slots(p) {
    var s = '', i;
    for (i = 0; i < p.shSlots; i++) s += '<span class="slot s' + (i < p.shLock ? ' lock' : '') + '" title="Kalkan Yuvası"></span>';
    s += ' ';
    for (i = 0; i < p.enSlots; i++) s += '<span class="slot e' + (i < p.enLock ? ' lock' : '') + '" title="Enerji Yuvası"></span>';
    return '<span class="slots">' + s + '</span>';
  }
  function panel(who, mine) {
    var p = G.p[who], tags = '';
    if (p.metal) tags += '<span class="tag">Metalik Deri</span>';
    if (p.reflect) tags += '<span class="tag">Yansıt</span>';
    if (p.mult > 1) tags += '<span class="tag">×2 hazır</span>';
    if (p.shLock) tags += '<span class="tag">Siper Kilitli</span>';
    if (p.enLock) tags += '<span class="tag">Kaynak Kilitli</span>';
    var st = p.stash ? (mine ? 'Gizli: ' + INFO[p.stash].name_tr : 'Gizli: 1 kapalı kart') : '';
    return '<div class="row"><span class="name">' + (mine ? 'Sen' : 'Rakip (Bot)') + '</span>' +
      (G.turn === who ? '<span class="turn ' + (mine ? '' : 'opp') + '">sıra</span>' : '') + '<span class="sp"></span>' +
      '<span class="stat hp">♥ ' + Math.max(0, p.hp) + '</span><span class="stat en">⚡ ' + p.en + '</span><span class="stat sh">🛡 ' + E.effShield(p) + '/' + E.cap(p) + '</span></div>' +
      '<div class="row" style="margin-top:6px">' + slots(p) + tags + '<span class="sp"></span><span class="mut">' + (mine ? '' : 'El: ' + p.hand.length) + ' ' + st + '</span></div>';
  }

  function render() {
    var O = 1 - H, me = G.p[H], myTurn = G.turn === H && G.phase === 'main' && !busy;
    var opHtml = panel(O, false);
    if (mode === 'takasPick') {
      opHtml += '<div class="row" style="margin-top:6px">' + G.p[O].hand.map(function (_, i) { return '<div class="back pick" data-opp="' + i + '"></div>'; }).join('') + '</div>';
    }
    $('oppPanel').innerHTML = opHtml;
    $('mePanel').innerHTML = panel(H, true);
    var gNext = Math.max(0, G.round + 1 - G.R.gerilimFrom + 1);
    $('info').innerHTML = '<div><b>Tur ' + G.round + '</b></div><div class="mut">Deste: ' + G.deck.length + '</div><div class="mut">Çöp: ' + G.disc.length + '</div>' +
      (G.disc.length ? '<div class="tag" style="margin-top:4px">üst: ' + INFO[G.disc[G.disc.length - 1]].name_tr + '</div>' : '') +
      '<div class="mut" style="margin-top:4px">' + (gNext > 0 ? '⚠ Gerilim sonraki turda: −' + gNext : 'Gerilim: ' + G.R.gerilimFrom + '. turda') + '</div>';
    var lg = $('log'); lg.innerHTML = G.log.slice(-40).map(function (l) {
      var cls = l.who === -1 ? 'sys' : (l.who === H ? 'me' : 'op'); return '<div class="' + cls + '">' + (l.who === -1 ? '' : (l.who === H ? 'Sen: ' : 'Bot: ')) + l.msg + '</div>';
    }).join(''); lg.scrollTop = lg.scrollHeight;

    // el
    var hh = '';
    me.hand.forEach(function (id, i) {
      var err = myTurn ? E.canPlay(G, H, id) : 'x';
      var off = (mode === null && err) ? 'off' : '';
      var s = sel.indexOf(i) >= 0 ? ' sel' : '';
      hh += cardHtml(id, off + s, 'data-i="' + i + '" title="' + (err && err !== 'x' ? err : '') + '"');
    });
    if (me.stash) {
      var ready = G.tcount > me.stashTurn;
      hh += '<div style="flex:0 0 auto;border-left:2px dashed var(--line);padding-left:6px">' + cardHtml(me.stash, ready ? '' : 'off', 'data-stash="1"') + '<div class="mut" style="font-size:10px;text-align:center">Gizli Alan' + (ready ? ' · bedava' : ' · hazır değil') + '</div></div>';
    }
    $('hand').innerHTML = hh;

    // prompt
    var pr = $('prompt');
    var msgs = { scrap: 'Çöp Atma: atılacak 2 kartı seç (' + sel.length + '/2)', stash: 'Gizle: Gizli Alan\'a koyulacak kartı seç', takasPick: 'Takas: rakibin kapalı kartlarından birini seç',
      takasGive: 'Takas: karşılığında vereceğin kartı seç', discard: 'El sınırı: atılacak ' + E.needDiscard(G, H) + ' kartı seç (' + sel.length + ' seçili)' };
    if (mode) { pr.style.display = 'block'; pr.innerHTML = msgs[mode] + (mode === 'takasGive' || mode === 'discard' ? '' : ' <button class="b" id="cancel" style="margin-left:8px;flex:none;padding:3px 10px">İptal</button>'); }
    else pr.style.display = 'none';

    // aksiyonlar
    var a = '';
    if (G.phase === 'ended') a = '<button class="b pri" id="again">Yeni oyun</button>';
    else {
      var t = me.tactic, en = me.en;
      a += '<button class="b" id="bScrap"' + (myTurn && me.scraps < G.R.scrapMax && me.hand.length >= 2 ? '' : ' disabled') + '>Çöp Atma 2→1 (' + (G.R.scrapMax - me.scraps) + ')</button>';
      a += '<button class="b" id="bStash"' + (myTurn && !t && !me.stash && me.hand.length ? '' : ' disabled') + '>Gizle</button>';
      a += '<button class="b" id="bTakas"' + (myTurn && !t && en >= 2 && G.p[O].hand.length ? '' : ' disabled') + '>Takas 2⚡</button>';
      a += '<button class="b" id="bGozcu"' + (myTurn && !t && en >= 1 ? '' : ' disabled') + '>Gözcü 1⚡</button>';
      a += '<button class="b pri" id="bEnd"' + (myTurn && mode === null ? '' : ' disabled') + '>Turu bitir</button>';
    }
    $('acts').innerHTML = a;
    bind();
  }

  function bind() {
    var q = function (s) { return document.querySelector(s); };
    var c = $('cancel'); if (c) c.onclick = function () { mode = null; sel = []; render(); };
    document.querySelectorAll('#hand [data-i]').forEach(function (el) { el.onclick = function () { onHand(+el.getAttribute('data-i')); }; });
    var st = q('#hand [data-stash]'); if (st) st.onclick = function () {
      if (G.turn !== H || G.phase !== 'main' || busy || mode) return; var r = E.playCard(G, H, 'stash'); if (!r.ok) flash(r.err); afterAct(); };
    document.querySelectorAll('[data-opp]').forEach(function (el) { el.onclick = function () { takasReveal(+el.getAttribute('data-opp')); }; });
    var map = { bScrap: function () { mode = 'scrap'; sel = []; render(); }, bStash: function () { mode = 'stash'; render(); },
      bTakas: function () { mode = 'takasPick'; render(); }, bGozcu: gozcuModal, bEnd: endMyTurn, again: start };
    Object.keys(map).forEach(function (k) { var b = $(k); if (b) b.onclick = map[k]; });
  }

  function flash(msg) { G.log.push({ who: -1, msg: '⚠ ' + msg }); }
  function onHand(i) {
    var me = G.p[H];
    if (G.phase === 'ended' || busy) return;
    if (mode === 'scrap') {
      var k = sel.indexOf(i); if (k >= 0) sel.splice(k, 1); else sel.push(i);
      if (sel.length === 2) { var r = E.scrap(G, H, sel[0], sel[1]); if (!r.ok) flash(r.err); mode = null; sel = []; }
      return render();
    }
    if (mode === 'stash') { var r2 = E.stash(G, H, i); if (!r2.ok) flash(r2.err); mode = null; return render(); }
    if (mode === 'takasGive') { var r3 = E.takas(G, H, takasTarget, 'swap', i); if (!r3.ok) flash(r3.err); mode = null; takasTarget = null; return afterAct(); }
    if (mode === 'discard') {
      var j = sel.indexOf(i); if (j >= 0) sel.splice(j, 1); else sel.push(i);
      if (sel.length === E.needDiscard(G, H)) { var d = sel.slice(); sel = []; mode = null; var re = E.endTurn(G, H, d); if (!re.ok) flash(re.err); return afterEnd(); }
      return render();
    }
    if (G.turn !== H || G.phase !== 'main') return;
    var r4 = E.playCard(G, H, i); if (!r4.ok) flash(r4.err); afterAct();
  }
  function afterAct() { render(); if (G.phase === 'ended') showEnd(); }
  function afterEnd() { render(); if (G.phase === 'ended') return showEnd(); runBot(); }

  function endMyTurn() {
    var n = E.needDiscard(G, H);
    if (n > 0) { mode = 'discard'; sel = []; return render(); }
    var r = E.endTurn(G, H); if (!r.ok) flash(r.err); afterEnd();
  }

  function modal(html) { $('modalBox').innerHTML = html; $('modal').style.display = 'flex'; }
  function closeModal() { $('modal').style.display = 'none'; }

  function riskModal() {
    var me = G.p[H], gain = Math.max(0, me.enSlots - me.enLock);
    modal('<h3>Tur ' + G.round + ' · Risk seçimi</h3><div class="mut">Enerji kazancın: +' + gain + ', kart: 2</div>' +
      '<button class="b opt" id="r0"><b>Normal</b><br><span class="mut">+' + gain + ' Enerji, 2 kart çek</span></button>' +
      '<button class="b opt" id="r1"><b>Cesur</b><br><span class="mut">+2 fazladan kart, −1 Enerji (kazançtan)</span></button>' +
      '<button class="b opt" id="r2"><b>Kumar (yazı-tura)</b><br><span class="mut">Yazı: +1 kart, +1 Enerji · Tura: −1 Enerji, −1 Can</span></button>');
    ['none', 'cesur', 'kumar'].forEach(function (m, i) { $('r' + i).onclick = function () { closeModal(); E.chooseRisk(G, H, m); render(); if (G.phase === 'ended') showEnd(); }; });
  }

  function takasReveal(oi) {
    takasTarget = oi; var id = G.p[1 - H].hand[oi], me = G.p[H];
    mode = null;
    modal('<h3>Takas: seçtiğin kart</h3>' + '<div style="display:flex;justify-content:center;margin:8px 0">' + cardHtml(id, '', 'disabled') + '</div>' +
      '<button class="b opt" id="tSwap"' + (me.en >= 2 ? '' : ' disabled') + '>Değiştir (2⚡): bir kartını ver</button>' +
      '<button class="b opt" id="tDisc"' + (me.en >= 3 ? '' : ' disabled') + '>Çöp\'e attır (3⚡)</button>');
    $('tSwap').onclick = function () { closeModal(); mode = 'takasGive'; render(); };
    $('tDisc').onclick = function () { closeModal(); var r = E.takas(G, H, oi, 'discard'); if (!r.ok) flash(r.err); takasTarget = null; afterAct(); };
  }

  function gozcuModal() {
    var top = E.gozcuPeek(G), bottom = [false, false];
    function draw() {
      modal('<h3>Gözcü: destenin üstü</h3><div class="mut">Alta koymak istediklerini işaretle.</div><div style="display:flex;gap:8px;justify-content:center;margin:10px 0">' +
        top.map(function (id, i) { return '<div style="text-align:center">' + cardHtml(id, bottom[i] ? 'off' : '', 'disabled') + '<button class="b" data-g="' + i + '" style="margin-top:6px;flex:none;width:100%">' + (bottom[i] ? 'Altta' : 'Üstte') + '</button></div>'; }).join('') +
        '</div><button class="b pri opt" id="gOk">Tamam (1⚡)</button><button class="b opt" id="gNo">Vazgeç</button>');
      document.querySelectorAll('[data-g]').forEach(function (b) { b.onclick = function () { var i = +b.getAttribute('data-g'); bottom[i] = !bottom[i]; draw(); }; });
      $('gOk').onclick = function () { closeModal(); var r = E.gozcu(G, H, bottom); if (!r.ok) flash(r.err); render(); };
      $('gNo').onclick = closeModal;
    }
    draw();
  }

  function showEnd() {
    var win = G.winner === H;
    modal('<h3>' + (win ? '🏆 Kazandın!' : 'Kaybettin') + '</h3><div class="mut">' + G.why + ' · ' + G.round + '. tur</div>' +
      '<div style="margin:8px 0">Sen ♥ ' + Math.max(0, G.p[H].hp) + ' · Bot ♥ ' + Math.max(0, G.p[1 - H].hp) + '</div><button class="b pri opt" id="mAgain">Yeni oyun</button><button class="b opt" id="mClose">Masaya bak</button>');
    $('mAgain').onclick = function () { closeModal(); start(); }; $('mClose').onclick = closeModal;
  }

  function runBot() {
    if (G.phase === 'ended') return;
    if (G.turn === H) { busy = false; render(); if (G.phase === 'risk') riskModal(); return; }
    busy = true; render();
    setTimeout(function step() {
      var more = E.botStep(G); render();
      if (G.phase === 'ended') { busy = false; return showEnd(); }
      if (more && G.turn !== H) setTimeout(step, 750);
      else runBot();
    }, 750);
  }

  function start() {
    modal('<h3>Cicikuş Kart Oyunu</h3><div class="mut">Prototip · Senaryo C · ortak 104 kart · Can 20</div>' +
      '<button class="b opt" id="s0"><b>1. oyuncu olarak başla</b><br><span class="mut">Enerji 4</span></button>' +
      '<button class="b opt" id="s1"><b>2. oyuncu olarak başla</b><br><span class="mut">Enerji 5 (denge bonusu)</span></button>' +
      '<div class="mut" style="margin-top:8px;font-size:12px">Bir kartı oynamak için üstüne dokun. Gizle/Takas/Gözcü: tur başına 1 Taktik.</div>');
    [0, 1].forEach(function (s) { $('s' + s).onclick = function () { closeModal(); H = s; G = E.newGame(); mode = null; sel = []; busy = false; render(); runBot(); }; });
  }
  window.addEventListener('load', function () { G = E.newGame(); render(); start(); });
})();

</script>
